services:
  frontend:
    build: ./apps/frontend
    container_name: cashlog-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cashlog-network
    restart: unless-stopped

  backend:
    build: ./apps/backend
    container_name: cashlog-backend
    expose:
      - "8080"
    environment:
      # Embedded H2 in file mode; the files live on the cashlog-data volume.
      CASHLOG_DB_PATH: /data/cashlog
      SPRING_FLYWAY_ENABLED: "true"
    volumes:
      - cashlog-data:/data
    networks:
      - cashlog-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  cashlog-data:
    name: cashlog-data

networks:
  cashlog-network:
    driver: bridge
