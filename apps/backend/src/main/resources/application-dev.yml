# Local development against a file-mode H2 database under apps/backend/data.
# Inherits the datasource from application.yml; only logging/SQL echo differ.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.cashlog: DEBUG
